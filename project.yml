name: muyynguyen
options:
  bundleIdPrefix: com.muyynguyen
targets:
  muyynguyen:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: ["."]
    exclude:
      - ".github"
      - "project.yml"
      - "README.md"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.muyynguyen.app
      INFOPLIST_FILE: Info.plist
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
